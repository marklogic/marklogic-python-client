[tool.poetry]
name = "marklogic-python-client"
version = "1.3.dev2"
description = "Python client for MarkLogic, built on the requests library"
authors = ["MarkLogic <general@developer.marklogic.com>"]
readme = "README.md"
packages = [{include = "marklogic"}]
include = [{ path = "sbom.spdx.json", format = ["sdist", "wheel"] }]
license = "Apache 2.0"
# Older Poetry silently ignores solver.min-release-age in poetry.toml.
requires-poetry = ">=2.5.1,<3"

# The only source, so the implicit PyPI source is disabled.
[[tool.poetry.source]]
name = "harness"
url = "https://pkg.harness.io/pkg/ct8onj8YTdaXtKaFsYCRLg/org-marklogic-python-private/python/simple"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.13"
requests = "2.34.2"
requests_toolbelt = "^1.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.2.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"
black = "26.10.1"
ipykernel = "^6.30.1"

# Forcing latest version to eliminate CVEs; transitive dependency of ipykernel.
jupyter-core = "^5.8.1"

# Forcing latest version to eliminate CVEs; transitive dependency of ipykernel.
tornado = "^6.6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Enables live logging; see https://docs.pytest.org/en/latest/how-to/logging.html#live-logs
log_cli = 1
log_cli_level = "DEBUG"
markers = ["unit: tests that do not require a MarkLogic server"]
